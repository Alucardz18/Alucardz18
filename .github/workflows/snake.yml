name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#334155&color_dots=#EBEDF0,#C9D4E3,#A9B8CC,#4A6FA5,#334155
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A9B8CC&color_dots=#161B22,#1C2533,#334155,#4A6FA5,#A9B8CC

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
