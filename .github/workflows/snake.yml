name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF69B4&color_dots=#FCE4EC,#F8BBD0,#F48FB1,#EF93C4,#FF69B4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF69B4&color_dots=#2D2D2D,#F8BBD0,#F48FB1,#EF93C4,#FF69B4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
