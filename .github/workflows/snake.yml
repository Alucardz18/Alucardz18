name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0A1F44&color_dots=#EBEDF0,#BFDBFE,#60A5FA,#2563EB,#1E3A8A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#93C5FD&color_dots=#161B22,#1E3A8A,#2563EB,#3B82F6,#93C5FD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
