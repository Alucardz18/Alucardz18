<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="284" viewBox="0 0 1000 284" role="img" aria-label="U.S. EV Market Share">
<style>
.bar{transform-box:fill-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
