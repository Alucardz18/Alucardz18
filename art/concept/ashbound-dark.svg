<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Ashbound, a roguelite platformer built in Godot">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f14"/><stop offset="1" stop-color="#2a1410"/></linearGradient>
<pattern id="ground" width="40" height="20" patternUnits="userSpaceOnUse">
<rect width="40" height="20" fill="#2a1d1d"/><rect width="20" height="10" fill="#33231f"/><rect x="20" y="10" width="20" height="10" fill="#33231f"/>
