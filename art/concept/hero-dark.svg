<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Nii-Oye Kpakpo, data analyst">
<style>
.ln{opacity:0;animation:fade .45s ease forwards}
.up{opacity:0;animation:rise .7s ease forwards}
.cur{animation:blink 1s steps(1) infinite}
